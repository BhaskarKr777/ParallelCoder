services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parallel_coder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parallel_coder}
      POSTGRES_DB: ${POSTGRES_DB:-parallel_coder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parallel_coder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lets api spawn sandboxed run containers (see runner.service.js)
  # without ever touching the host's Docker socket directly. Only
  # the container/image operations docker run/kill/rm actually need
  # are allowlisted; everything else (exec, volumes, swarm, the
  # socket itself) stays denied. api talks to this over the internal
  # compose network only - no host port is published.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Builds the one image every sandboxed run container is spawned
  # from (see runner.dockerfile + runner.service.js) - node/python/gcc/
  # jdk baked into a single image instead of pulling one per
  # language. This container never does anything itself; `api`
  # depends on the build finishing, not on it staying up.
  runner-image:
    build:
      context: .
      dockerfile: runner.dockerfile
    image: parallel-coder-runner:latest
    command: ["true"]

  migrate:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_YJS_URL: ${VITE_YJS_URL:-ws://localhost:1234}
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &backend_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-parallel_coder}:${POSTGRES_PASSWORD:-parallel_coder}@postgres:5432/${POSTGRES_DB:-parallel_coder}?schema=public
      PORT: "3000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_YJS_URL: ${VITE_YJS_URL:-ws://localhost:1234}
    command: ["node", "server.js"]
    environment:
      <<: *backend_env
      DOCKER_HOST: tcp://docker-proxy:2375
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
      runner-image:
        condition: service_completed_successfully

  yjs:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_YJS_URL: ${VITE_YJS_URL:-ws://localhost:1234}
    command: ["node", "websocket/yjs-server.js"]
    environment:
      <<: *backend_env
      YJS_PERSISTENCE_DIR: /data/yjs
    volumes:
      - yjs_data:/data/yjs
    ports:
      - "${YJS_PORT:-1234}:1234"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  yjs_data:
