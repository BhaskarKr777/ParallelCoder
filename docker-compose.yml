services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parallel_coder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parallel_coder}
      POSTGRES_DB: ${POSTGRES_DB:-parallel_coder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parallel_coder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.1.1
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2375 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner-image:
    build:
      context: .
      dockerfile: runner.dockerfile
    image: parallel-coder-runner:1.0.0
    command: ["true"]

  migrate:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_YJS_URL: ${VITE_YJS_URL:-ws://localhost:1234}
    restart: on-failure
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: &backend_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-parallel_coder}:${POSTGRES_PASSWORD:-parallel_coder}@postgres:5432/${POSTGRES_DB:-parallel_coder}?schema=public
      PORT: "3000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_YJS_URL: ${VITE_YJS_URL:-ws://localhost:1234}
    restart: unless-stopped
    command: ["node", "server.js"]
    environment:
      <<: *backend_env
      DOCKER_HOST: tcp://docker-proxy:2375
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
      runner-image:
        condition: service_completed_successfully

  yjs:
    build:
      context: .
      dockerfile: dockerfile
      args:
        VITE_YJS_URL: ${VITE_YJS_URL:-ws://localhost:1234}
    restart: unless-stopped
    command: ["node", "websocket/yjs-server.js"]
    environment:
      <<: *backend_env
      YJS_PERSISTENCE_DIR: /data/yjs
    volumes:
      - yjs_data:/data/yjs
    ports:
      - "${YJS_PORT:-1234}:1234"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const ws = new (require(\"ws\"))(\"ws://localhost:1234\"); ws.on(\"open\", () => process.exit(0)); ws.on(\"error\", () => process.exit(1));'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  yjs_data:

